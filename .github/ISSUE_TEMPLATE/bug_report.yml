name: Bug Report
description: File a bug report for gtrends-mcp-full
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix it.
  - type: input
    id: tool_name
    attributes:
      label: Tool name
      description: "The MCP tool that was called (e.g. trending_now, interest_over_time, seasonality) or the CLI command."
      placeholder: "e.g. interest_over_time"
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: "What went wrong, with the arguments used and the full error message if there was one."
    validations:
      required: true
  - type: textarea
    id: what_expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: Output of `gtrends-mcp-full doctor`
      description: "Run `gtrends-mcp-full doctor` and paste the output. It prints no cookies, proxy passwords or keywords — but this issue is public, so read it through before you post."
      render: shell
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: "e.g. 0.1.0 (gtrends-mcp-full --version)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4"
    validations:
      required: true
  - type: input
    id: mcp_client
    attributes:
      label: MCP client
      placeholder: "e.g. Claude Desktop, Claude Code, Cursor, VS Code"
    validations:
      required: true
